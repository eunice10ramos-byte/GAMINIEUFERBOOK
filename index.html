<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAMINIEUFERBOOK – Librería y papelería</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--black:#1a1a1a;--navy:#001f54;--sand:#d6c8b4;--gold:#c19a4b;--white:#fff;--bg:#f4f2ee}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--black)}
h1,h2,h3,.brand b{font-family:'League Spartan',sans-serif}
button{font-family:inherit;cursor:pointer;border:0}
.app{max-width:1200px;margin:0 auto;background:var(--white);min-height:100vh;container:app/inline-size}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e5e0d6;position:sticky;top:0;background:var(--white);z-index:5;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--black);color:var(--gold);display:grid;place-items:center;font:700 20px 'League Spartan'}
.brand b{display:block;font-size:18px;letter-spacing:.5px;line-height:1.1}
.brand small{font-size:10px;letter-spacing:3px;text-transform:uppercase}
nav{display:none;gap:24px}
nav a{color:var(--black);text-decoration:none;font-weight:500}
nav a:hover{color:var(--gold)}
.cart-btn{position:relative;width:44px;height:44px;border-radius:50%;background:var(--sand);font-size:20px}
.cart-btn span{position:absolute;top:-4px;right:-4px;background:var(--navy);color:#fff;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:none;place-items:center;padding:0 4px}
main{padding:20px}
.search{width:100%;padding:14px 16px;border:2px solid var(--sand);border-radius:12px;font:16px 'Jost';outline:0}
.search:focus{border-color:var(--gold)}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:28px 24px;margin:20px 0}
.hero small{letter-spacing:4px;font-size:12px;opacity:.8}
.hero h1{font-size:28px;line-height:1.15;margin:8px 0 4px}
.script{font-family:'Pinyon Script',cursive;color:var(--gold);font-size:30px;font-style:italic}
.cta{background:var(--gold);color:var(--black);padding:14px 24px;border-radius:10px;font-size:17px;font-weight:500;margin-top:16px}
.cta:hover{filter:brightness(1.1)}
h2{font-size:20px;margin:8px 0 12px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.cat{background:var(--sand);padding:20px 14px;border-radius:14px;font:500 17px 'Jost';text-align:left;color:var(--black);transition:.2s}
.cat:hover{transform:translateY(-2px)}
.cat.active{background:var(--black);color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid #e5e0d6;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:120px;display:grid;place-items:center;overflow:hidden;position:relative}
.thumb svg{width:84px;height:84px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));transition:transform .25s}
.thumb img{width:100%;height:100%;object-fit:cover}
.card{transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 8px 20px rgba(0,0,0,.12);transform:translateY(-3px)}
.card:hover .thumb svg{transform:scale(1.1) rotate(-3deg)}
.hero{position:relative;overflow:hidden;padding-bottom:36px}
.hero>*{position:relative;z-index:1}
.hero .deco{position:absolute;right:10px;bottom:0;width:120px;height:auto;z-index:0;opacity:.95}
.hero .cta{margin-right:130px}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info small{color:#777}
.info h3{font-size:15px}
.price{font-weight:700;color:var(--navy)}
.add{margin-top:auto;background:var(--black);color:#fff;padding:9px;border-radius:8px;font-size:14px}
.add:hover{background:var(--gold);color:var(--black)}
.empty{grid-column:1/-1;text-align:center;padding:30px;color:#777}
footer{text-align:center;padding:24px;font-size:13px;color:#777;border-top:1px solid #e5e0d6;margin-top:30px}
.scene{display:none;position:absolute;right:30px;bottom:0;height:92%;width:auto;z-index:0}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.fb{background:var(--bg);border-radius:14px;padding:16px 8px 12px;text-align:center;color:var(--black);transition:.2s}
.fb:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.fb svg{width:100%;max-width:105px;height:auto;filter:drop-shadow(3px 5px 5px rgba(0,0,0,.3))}
.fb span{display:block;font:600 14px 'League Spartan',sans-serif;margin-top:10px}
.sw{position:relative}
.res{display:none;position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#fff;border:1px solid var(--sand);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.18);z-index:6;overflow:hidden}
.res.open{display:block}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #f0ece4}
.row .mini{width:40px;height:40px;border-radius:8px;flex:none;display:grid;place-items:center}
.row .mini svg{width:30px;height:30px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--navy);font-weight:600}
.row button{background:var(--black);color:#fff;border-radius:8px;padding:7px 10px;font-size:13px}
.row button:hover{background:var(--gold);color:var(--black)}
.all{width:100%;padding:11px;background:var(--bg);font-weight:500;color:var(--navy)}
.nores{padding:14px;text-align:center;color:#777}
.view-btn{display:none;background:var(--black);color:var(--gold);padding:10px 14px;border-radius:10px;font-size:14px;white-space:nowrap}
@media(min-width:768px){.view-btn{display:inline-block}}
header .right{display:flex;align-items:center;gap:12px}
@container app (max-width:500px){.brand b{font-size:16px}.brand small{letter-spacing:2px}header{padding:14px 16px}.brand{gap:10px}}
body.phone{background:#2b2b2b}
body.phone .app{max-width:390px;margin:24px auto;border:10px solid #111;border-radius:40px;overflow:clip;min-height:calc(100vh - 48px)}
body.phone aside{width:370px;right:-420px}
body.phone aside.open{right:calc(50% - 185px)}
/* carrito */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9}
.overlay.open{display:block}
aside{position:fixed;top:0;right:-100%;width:min(380px,100%);height:100%;background:#fff;z-index:10;transition:right .3s;display:flex;flex-direction:column;padding:20px}
aside.open{right:0}
.aside-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.close{background:none;font-size:24px}
#items{flex:1;overflow:auto}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;gap:8px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border-radius:50%;background:var(--sand)}
.total{display:flex;justify-content:space-between;font:700 20px 'League Spartan';padding:16px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--black);color:var(--gold);padding:12px 20px;border-radius:10px;transition:.3s;z-index:20}
.toast.show{transform:translateX(-50%) translateY(0)}
@container app (min-width:768px){
 nav{display:flex}
 main{padding:32px 40px}
 .hero{padding:48px;display:flex;flex-direction:column;align-items:flex-start}
 .hero h1{font-size:44px;max-width:560px}
 .script{font-size:42px}
 .cats{grid-template-columns:repeat(4,1fr)}
 .grid{grid-template-columns:repeat(3,1fr)}
 .thumb{height:150px}
 .thumb svg{width:100px;height:100px}
 .hero .deco{width:300px;right:40px}
 .hero .cta{margin-right:0}
 .hero{background:#ded4c7;color:var(--black);min-height:320px;justify-content:center}
 .hero small{opacity:.7}
 .hero .script{color:#a47d33}
 .hero .cta{background:var(--black);color:var(--gold)}
 .hero .deco{display:none}
 .hero .scene{display:block}
 .fb svg{max-width:150px}
 .fb span{font-size:17px}
}
@container app (min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
 <header>
  <div class="brand"><div class="logo">G</div><div><b>GAMINIEUFERBOOK</b><small>Librería y papelería</small></div></div>
  <nav><a href="#" data-cat="Todos">Inicio</a><a href="#catalogo" data-cat="Libros">Libros</a><a href="#catalogo" data-cat="Útiles escolares">Útiles</a><a href="#catalogo" data-cat="Oficina">Oficina</a><a href="#catalogo" data-cat="Impresiones">Impresiones</a></nav>
  <div class="right"><button class="view-btn" id="viewBtn" title="Cambiar vista">📱<span class="lbl"> Vista móvil</span></button><button class="cart-btn" id="openCart" aria-label="Carrito">🛒<span id="count">0</span></button></div>
 </header>
 <main>
  <div class="sw"><input class="search" id="q" type="search" placeholder="Buscar libros, cuadernos, útiles..." autocomplete="off"><div class="res" id="res"></div></div>
  <section class="hero">
   <small>REGRESO A CLASES</small>
   <h1>Tu lista de útiles en un solo pedido</h1>
   <div class="script">Más allá del papel</div>
   <svg class="deco" viewBox="0 0 200 150" aria-hidden="true"><rect x="20" y="112" width="160" height="26" rx="4" fill="#c19a4b"/><rect x="20" y="112" width="14" height="26" fill="#a47d33"/><rect x="50" y="122" width="110" height="3" fill="#001f54"/><rect x="34" y="84" width="140" height="26" rx="4" fill="#d6c8b4"/><rect x="34" y="84" width="14" height="26" fill="#b9a98f"/><rect x="62" y="94" width="90" height="3" fill="#001f54"/><rect x="26" y="56" width="132" height="26" rx="4" fill="#fff"/><rect x="26" y="56" width="14" height="26" fill="#ddd"/><rect x="54" y="66" width="80" height="3" fill="#c19a4b"/><g transform="rotate(-25 150 40)"><rect x="140" y="6" width="10" height="56" fill="#c19a4b"/><polygon points="140,62 150,62 145,76" fill="#d6c8b4"/><rect x="140" y="6" width="10" height="8" fill="#fff"/></g></svg>
   <svg class="scene" viewBox="0 0 340 220" aria-hidden="true"><ellipse cx="180" cy="208" rx="160" ry="9" fill="#000" opacity=".12"/><rect x="60" y="64" width="96" height="140" rx="6" fill="#d6c8b4" stroke="#b9a98f"/><rect x="72" y="84" width="48" height="4" fill="#a47d33"/><rect x="130" y="30" width="100" height="176" rx="6" fill="#b99b78"/><rect x="214" y="30" width="8" height="176" fill="#1a1a1a" opacity=".8"/><rect x="146" y="50" width="40" height="5" fill="#1a1a1a" opacity=".55"/><circle cx="170" cy="150" r="14" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/><g transform="rotate(8 262 110)"><rect x="248" y="20" width="22" height="186" rx="3" fill="#c9a56a"/><rect x="248" y="30" width="14" height="2" fill="#1a1a1a"/><rect x="248" y="42" width="9" height="2" fill="#1a1a1a"/><rect x="248" y="54" width="14" height="2" fill="#1a1a1a"/><rect x="248" y="66" width="9" height="2" fill="#1a1a1a"/><rect x="248" y="78" width="14" height="2" fill="#1a1a1a"/><rect x="248" y="90" width="9" height="2" fill="#1a1a1a"/><rect x="248" y="102" width="14" height="2" fill="#1a1a1a"/><rect x="248" y="114" width="9" height="2" fill="#1a1a1a"/><rect x="248" y="126" width="14" height="2" fill="#1a1a1a"/><rect x="248" y="138" width="9" height="2" fill="#1a1a1a"/><rect x="248" y="150" width="14" height="2" fill="#1a1a1a"/><rect x="248" y="162" width="9" height="2" fill="#1a1a1a"/><rect x="248" y="174" width="14" height="2" fill="#1a1a1a"/><rect x="248" y="186" width="9" height="2" fill="#1a1a1a"/><rect x="248" y="198" width="14" height="2" fill="#1a1a1a"/></g><rect x="288" y="120" width="40" height="84" rx="6" fill="#8a6f4d"/><g stroke-width="7" stroke-linecap="round"><line x1="298" y1="122" x2="290" y2="70" stroke="#1a1a1a"/><line x1="308" y1="122" x2="310" y2="60" stroke="#001f54"/><line x1="318" y1="122" x2="328" y2="76" stroke="#c19a4b"/></g><g transform="rotate(-60 120 190)"><rect x="40" y="184" width="150" height="10" rx="5" fill="#001f54"/><rect x="40" y="184" width="30" height="10" fill="#c19a4b"/><polygon points="190,184 190,194 208,189" fill="#c19a4b"/></g><path d="M236 40v34a8 8 0 0 1-16 0V34a5 5 0 0 1 10 0v36" fill="none" stroke="#c19a4b" stroke-width="3"/></svg>
   <button class="cta" id="verCat">Ver catálogo</button>
  </section>
  <h2>Categorías de libros destacadas</h2>
  <div class="feat" id="feat"></div>
  <h2>Categorías</h2>
  <div class="cats" id="cats"></div>
  <h2 id="catalogo">Catálogo</h2>
  <div class="grid" id="grid"></div>
 </main>
 <footer>© 2026 GAMINIEUFERBOOK · Más allá del papel</footer>
</div>

<div class="overlay" id="overlay"></div>
<aside id="drawer">
 <div class="aside-h"><h2>Tu pedido</h2><button class="close" id="closeCart">✕</button></div>
 <div id="items"></div>
 <div class="total"><span>Total</span><span id="total">L 0.00</span></div>
 <button class="cta" id="checkout" style="width:100%;margin:0">Finalizar pedido</button>
</aside>
<div class="toast" id="toast"></div>

<script>
const products=[
 {id:1,n:"Cien años de soledad",c:"Libros",g:"Literatura",p:285,i:"book"},
 {id:2,n:"El principito",c:"Libros",g:"Literatura",p:150,i:"book"},
 {id:3,n:"Don Quijote de la Mancha",c:"Libros",g:"Literatura",p:340,i:"book"},
 {id:13,n:"Matemáticas básicas",c:"Libros",g:"Educación",p:210,i:"openbook"},
 {id:14,n:"Gramática española",c:"Libros",g:"Educación",p:180,i:"openbook"},
 {id:15,n:"Atlas escolar",c:"Libros",g:"Educación",p:260,i:"globe"},
 {id:16,n:"Historia de Honduras",c:"Libros",g:"Historia",p:230,i:"column"},
 {id:17,n:"Breve historia del mundo",c:"Libros",g:"Historia",p:310,i:"globe"},
 {id:18,n:"Grandes civilizaciones",c:"Libros",g:"Historia",p:295,i:"column"},
 {id:4,n:"Cuaderno universitario 100 h",c:"Útiles escolares",p:45,i:"notebook"},
 {id:5,n:"Caja de lápices HB x12",c:"Útiles escolares",p:60,i:"pencils"},
 {id:6,n:"Mochila escolar",c:"Útiles escolares",p:420,i:"backpack"},
 {id:7,n:"Resma de papel carta",c:"Oficina",p:155,i:"ream"},
 {id:8,n:"Grapadora metálica",c:"Oficina",p:95,i:"stapler"},
 {id:9,n:"Folders manila x25",c:"Oficina",p:110,i:"folders"},
 {id:10,n:"Impresión B/N (por página)",c:"Impresiones",p:2,i:"printer"},
 {id:11,n:"Impresión a color (por página)",c:"Impresiones",p:8,i:"printerc"},
 {id:12,n:"Empastado de tesis",c:"Impresiones",p:250,i:"thesis"}
 // Para usar una foto real agrega: img:"fotos/archivo.jpg"
];
const cats=["Libros","Útiles escolares","Oficina","Impresiones"];
const pal={"Libros":["#001f54","#c19a4b","#fff"],"Útiles escolares":["#d6c8b4","#1a1a1a","#c19a4b"],"Oficina":["#1a1a1a","#d6c8b4","#c19a4b"],"Impresiones":["#c19a4b","#001f54","#fff"]};
const art={
 book:(a,b)=>`<rect x="26" y="12" width="52" height="76" rx="4" fill="${a}"/><rect x="26" y="12" width="9" height="76" rx="3" fill="${b}" opacity=".6"/><rect x="42" y="26" width="28" height="4" fill="${b}"/><rect x="42" y="35" width="20" height="3" fill="${b}"/><circle cx="56" cy="64" r="9" fill="none" stroke="${b}" stroke-width="3"/>`,
 notebook:(a,b)=>`<rect x="24" y="12" width="54" height="76" rx="5" fill="${a}"/>${[24,38,52,66,80].map(y=>`<circle cx="24" cy="${y}" r="3.5" fill="${b}"/>`).join("")}<rect x="38" y="28" width="32" height="3" fill="${b}"/><rect x="38" y="40" width="32" height="3" fill="${b}"/><rect x="38" y="52" width="32" height="3" fill="${b}"/><rect x="38" y="64" width="20" height="3" fill="${b}"/>`,
 pencils:(a,b)=>[-35,0,35].map(r=>`<g transform="rotate(${r} 50 50)"><rect x="44" y="8" width="12" height="62" fill="${a}"/><polygon points="44,70 56,70 50,88" fill="${b}"/><rect x="44" y="8" width="12" height="9" fill="${b}"/></g>`).join(""),
 backpack:(a,b)=>`<rect x="26" y="24" width="48" height="62" rx="18" fill="${a}"/><path d="M38 26a12 12 0 0 1 24 0" fill="none" stroke="${b}" stroke-width="5"/><rect x="34" y="56" width="32" height="22" rx="6" fill="${b}"/><rect x="34" y="42" width="32" height="3" fill="${b}"/>`,
 ream:(a,b)=>`<rect x="20" y="58" width="60" height="26" rx="3" fill="${a}"/><rect x="20" y="66" width="60" height="10" fill="${b}"/><rect x="24" y="44" width="52" height="14" fill="#fff"/><rect x="28" y="30" width="44" height="14" fill="#fff" opacity=".8"/><rect x="32" y="18" width="36" height="12" fill="#fff" opacity=".6"/>`,
 stapler:(a,b)=>`<rect x="14" y="62" width="72" height="14" rx="3" fill="${a}"/><path d="M18 60L82 38l4 12-62 12z" fill="${b}"/><rect x="26" y="76" width="48" height="5" fill="${b}"/>`,
 folders:(a,b)=>`<path d="M16 28h26l7 9h35v48H16z" fill="${a}"/><path d="M16 48h68v38H16z" fill="${b}"/><rect x="28" y="60" width="26" height="3" fill="${a}"/>`,
 printer:(a,b)=>`<rect x="30" y="12" width="40" height="28" fill="#fff"/><rect x="14" y="38" width="72" height="36" rx="7" fill="${a}"/><rect x="30" y="62" width="40" height="26" fill="#fff"/><rect x="36" y="72" width="28" height="3" fill="${b}"/><circle cx="74" cy="48" r="3" fill="${b}"/>`,
 thesis:(a,b)=>`<rect x="24" y="12" width="54" height="76" rx="3" fill="${a}"/>${[22,34,46,58,70,82].map(y=>`<rect x="18" y="${y-3}" width="12" height="5" rx="2.5" fill="${b}"/>`).join("")}<rect x="38" y="30" width="30" height="4" fill="${b}"/><rect x="38" y="40" width="22" height="3" fill="${b}"/><circle cx="56" cy="66" r="8" fill="${b}"/>`
};
art.openbook=(a,b)=>`<path d="M50 28C38 20 22 20 10 24v56c12-4 28-4 40 4z" fill="${a}"/><path d="M50 28c12-8 28-8 40-4v56c-12-4-28-4-40 4z" fill="${b}"/><rect x="20" y="36" width="22" height="3" fill="${b}"/><rect x="20" y="46" width="18" height="3" fill="${b}"/><rect x="58" y="36" width="22" height="3" fill="${a}"/><rect x="58" y="46" width="18" height="3" fill="${a}"/>`;
art.globe=(a,b)=>`<circle cx="50" cy="44" r="31" fill="${a}"/><ellipse cx="50" cy="44" rx="13" ry="31" fill="none" stroke="${b}" stroke-width="3"/><line x1="19" y1="44" x2="81" y2="44" stroke="${b}" stroke-width="3"/><path d="M30 80h40l-6 10H36z" fill="${b}"/>`;
art.column=(a,b)=>`<polygon points="50,10 82,26 18,26" fill="${a}"/><rect x="26" y="30" width="48" height="6" fill="${a}"/>${[30,46,62].map(x=>`<rect x="${x}" y="38" width="8" height="40" fill="${b}"/>`).join("")}<rect x="20" y="80" width="60" height="9" fill="${a}"/>`;
art.printerc=(a,b)=>art.printer(a,b)+`<circle cx="42" cy="48" r="3" fill="#e63946"/><circle cx="52" cy="48" r="3" fill="#2a9d8f"/><circle cx="62" cy="48" r="3" fill="#f4c430"/>`;
const gpal={"Literatura":["#001f54","#c19a4b","#fff"],"Educación":["#d6c8b4","#001f54","#c19a4b"],"Historia":["#2f4a3a","#d6c8b4","#c19a4b"]};
function thumb(p){
 const [bg,a,b]=(p.g&&gpal[p.g])||pal[p.c];
 if(p.img)return `<div class="thumb" style="background:${bg}"><img src="${p.img}" alt="${p.n}" loading="lazy" onerror="this.remove()"></div>`;
 return `<div class="thumb" style="background:${bg}"><svg viewBox="0 0 100 100" role="img" aria-label="${p.n}">${art[p.i](a,b)}</svg></div>`;
}
let cat="Todos",sub="",term="",cart={};
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const $=s=>document.querySelector(s);
const money=n=>"L "+n.toFixed(2);

function renderCats(){
 $("#cats").innerHTML=cats.map(c=>`<button class="cat ${c===cat?'active':''}" data-c="${c}">${c}</button>`).join("");
}
function renderGrid(){
 const list=products.filter(p=>term?norm(p.n+" "+p.c+" "+(p.g||"")).includes(term):((cat==="Todos"||p.c===cat)&&(!sub||p.g===sub)));
 $("#catalogo").textContent="Catálogo"+(term?" · resultados de la búsqueda":sub?" · "+sub:cat!=="Todos"?" · "+cat:"");
 $("#grid").innerHTML=list.length?list.map(p=>`<div class="card">${thumb(p)}<div class="info"><small>${p.c}</small><h3>${p.n}</h3><span class="price">${money(p.p)}</span><button class="add" data-id="${p.id}">Agregar</button></div></div>`).join(""):'<div class="empty">No encontramos resultados.</div>';
}
function renderCart(){
 const ids=Object.keys(cart);
 const qty=ids.reduce((a,i)=>a+cart[i],0);
 const badge=$("#count");badge.textContent=qty;badge.style.display=qty?"grid":"none";
 $("#items").innerHTML=ids.length?ids.map(i=>{const p=products.find(x=>x.id==i);return `<div class="item"><div><b>${p.n}</b><br><small>${money(p.p)}</small></div><div class="qty"><button data-m="${i}">−</button>${cart[i]}<button data-p="${i}">+</button></div></div>`}).join(""):'<div class="empty">Tu carrito está vacío.</div>';
 $("#total").textContent=money(ids.reduce((a,i)=>a+cart[i]*products.find(x=>x.id==i).p,0));
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function toggleCart(o){$("#drawer").classList.toggle("open",o);$("#overlay").classList.toggle("open",o)}
function setCat(c){if(sub&&c===cat){sub=""}else{cat=c===cat?"Todos":c;sub=""}clearSearch();renderCats();renderGrid()}
function clearSearch(){term="";$("#q").value="";$("#res").classList.remove("open")}
function addCart(id){cart[id]=(cart[id]||0)+1;renderCart();toast("Agregado al carrito")}

function mini(p){const [bg,a,b]=(p.g&&gpal[p.g])||pal[p.c];return `<div class="mini" style="background:${bg}"><svg viewBox="0 0 100 100">${art[p.i](a,b)}</svg></div>`}
function showRes(){
 const r=$("#res");
 if(!term){r.classList.remove("open");return}
 const m=products.filter(p=>norm(p.n+" "+p.c+" "+(p.g||"")).includes(term));
 r.innerHTML=m.length?m.slice(0,5).map(p=>`<div class="row">${mini(p)}<div class="t"><b>${p.n}</b><small>${money(p.p)}</small></div><button data-id="${p.id}">Agregar</button></div>`).join("")+`<button class="all" id="all">Ver los ${m.length} resultado${m.length>1?"s":""} en el catálogo</button>`:'<div class="nores">No encontramos resultados.</div>';
 r.classList.add("open");
}
function goCatalog(){$("#res").classList.remove("open");$("#catalogo").scrollIntoView({behavior:"smooth"})}
$("#q").addEventListener("input",e=>{term=norm(e.target.value.trim());sub="";renderGrid();showRes()});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"&&term)goCatalog()});
$("#res").addEventListener("click",e=>{
 const b=e.target.closest("[data-id]");if(b)return addCart(+b.dataset.id);
 if(e.target.closest("#all"))goCatalog();
});
document.addEventListener("click",e=>{if(!e.target.closest(".sw"))$("#res").classList.remove("open")});
$("#viewBtn").onclick=()=>{const on=document.body.classList.toggle("phone");$("#viewBtn").innerHTML=on?"🖥️":"📱<span class=\"lbl\"> Vista móvil</span>";$("#viewBtn").title=on?"Volver a vista PC":"Ver como móvil";window.scrollTo({top:0})};
$("#cats").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b){setCat(b.dataset.c);$("#catalogo").scrollIntoView({behavior:"smooth"})}});
$("#grid").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)addCart(+b.dataset.id)});
$("#items").addEventListener("click",e=>{
 const m=e.target.dataset.m,p=e.target.dataset.p;
 if(p)cart[p]++;
 if(m){cart[m]--;if(!cart[m])delete cart[m]}
 renderCart();
});
$("#verCat").onclick=()=>{cat="Todos";sub="";clearSearch();renderCats();renderGrid();$("#catalogo").scrollIntoView({behavior:"smooth"})};
$("#openCart").onclick=()=>toggleCart(true);
$("#closeCart").onclick=$("#overlay").onclick=()=>toggleCart(false);
$("#checkout").onclick=()=>{if(!Object.keys(cart).length)return toast("Agrega productos primero");cart={};renderCart();toggleCart(false);toast("¡Pedido realizado! Gracias por tu compra")};
document.querySelectorAll("nav a").forEach(a=>a.onclick=e=>{if(a.getAttribute("href")==="#")e.preventDefault();sub="";clearSearch();cat=a.dataset.cat==="Todos"?"Todos":a.dataset.cat;renderCats();renderGrid()});
const motif={
 Literatura:(c)=>`<path d="M72 60C52 64 38 82 36 106c15-4 30-17 36-46z" fill="${c}"/><line x1="36" y1="108" x2="60" y2="80" stroke="#001f54" stroke-width="2"/>`,
 Educación:(c)=>`<polygon points="54,62 86,78 54,94 22,78" fill="${c}"/><path d="M38 87v15c11 9 27 9 33 0V86" fill="none" stroke="${c}" stroke-width="3.5"/><line x1="86" y1="78" x2="86" y2="102" stroke="${c}" stroke-width="3"/>`,
 Historia:(c)=>`<polygon points="54,60 84,74 24,74" fill="${c}"/>${[30,47,64].map(x=>`<rect x="${x}" y="78" width="8" height="28" fill="${c}"/>`).join("")}<rect x="24" y="108" width="60" height="6" fill="${c}"/>`
};
function cover(bg,ac,g){return `<svg viewBox="0 0 100 140"><rect x="4" y="4" width="92" height="132" rx="5" fill="${bg}"/><rect x="4" y="4" width="10" height="132" rx="4" fill="#000" opacity=".25"/><text x="55" y="34" text-anchor="middle" font-family="League Spartan,sans-serif" font-weight="700" font-size="11" letter-spacing="1.5" fill="${ac}">${g.toUpperCase()}</text><rect x="30" y="42" width="50" height="2" fill="${ac}" opacity=".7"/>${motif[g](ac)}<rect x="30" y="124" width="50" height="2" fill="${ac}" opacity=".7"/></svg>`}
const feats=[["#002a5c","#c19a4b","Literatura"],["#d6c8b4","#001f54","Educación"],["#2f4a3a","#d6c8b4","Historia"]];
$("#feat").innerHTML=feats.map(f=>`<button class="fb" data-g="${f[2]}">${cover(f[0],f[1],f[2])}<span>${f[2]}</span></button>`).join("");
$("#feat").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(b){clearSearch();cat="Libros";sub=b.dataset.g;renderCats();renderGrid();$("#catalogo").scrollIntoView({behavior:"smooth"})}});
renderCats();renderGrid();renderCart();
</script>
</body>
</html>
